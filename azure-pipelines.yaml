name: Azure Pipelines

# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
trigger:
- main

# ToDo: Replace the agent pool name, if you are using Udacity Cloud lab. 
# Otherwise, comment out the line below. 
# pool: Default

variables:
  python.version: '3.7.6'
  # ToDo: Replace the service connection name as used in the DevOps project settings
  azureServiceConnectionId: 'TerraformConnection'
  # Project root folder. Point to the folder containing manage.py file.
  projectRoot: $(System.DefaultWorkingDirectory)
  # Environment name
  environmentName: 'test-vm'
  tfstatenumber : "tfstate9290792907"
  # terraform resource group
  tfrg: 'rg-test'

stages:
#--------------------------------------------#  
# BUILD STAGE
#--------------------------------------------#    
- stage: Build
  jobs:
  - job: BuildInfrastructure
    steps:
    #--------------------------------------------#  
    # Use Terraform to create the Infrastructure      
    # Install Terraform on the pipeline agent 
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: 'Terrafom installation'
      inputs:
        terraformVersion: '1.2.9'

    - script: |
        cd $(System.DefaultWorkingDirectory)/terraform/environments/test
        terraform init \
          -backend-config="storage_account_name=$(tfstatenumber)" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=test.terraform.tfstate" \
          -backend-config="resource_group_name=$(tfrg)" \
          -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
          -backend-config="client_id=$ARM_CLIENT_ID" \
          -backend-config="client_secret=$ARM_CLIENT_SECRET" \
          -backend-config="tenant_id=$ARM_TENANT_ID"
      displayName: 'Terraform Init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
      env:
        ARM_SUBSCRIPTION_ID: $(subscriptionId)
        ARM_CLIENT_ID: $(clientId)
        ARM_CLIENT_SECRET: $(clientSecret)
        ARM_TENANT_ID: $(tenantId)
      

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: Terraform validate
      inputs:
        provider: 'azurerm'
        command: 'validate'

    - script: |
        cd $(System.DefaultWorkingDirectory)/terraform/environments/test
        terraform plan -out=tfplan
      displayName: 'Terraform Plan'
      env:
        ARM_SUBSCRIPTION_ID: $(subscriptionId)
        ARM_CLIENT_ID: $(clientId)
        ARM_CLIENT_SECRET: $(clientSecret)
        ARM_TENANT_ID: $(tenantId)
    
    # Run Terraform Apply
    - script: |
        cd $(System.DefaultWorkingDirectory)/terraform/environments/test
        terraform apply -auto-approve tfplan
      displayName: 'Terraform Apply'
      env:
        ARM_SUBSCRIPTION_ID: $(subscriptionId)
        ARM_CLIENT_ID: $(clientId)
        ARM_CLIENT_SECRET: $(clientSecret)
        ARM_TENANT_ID: $(tenantId)

   # Run Terraform Destroy
    # - script: |
    #     cd $(System.DefaultWorkingDirectory)/terraform/environments/test
    #     terraform destroy -auto-approve
    #   displayName: 'Terraform Destroy'
    #   env:
    #     ARM_SUBSCRIPTION_ID: $(subscriptionId)
    #     ARM_CLIENT_ID: $(clientId)
    #     ARM_CLIENT_SECRET: $(clientSecret)
    #     ARM_TENANT_ID: $(tenantId)

    # JMeter (Performance) Test Suite - Archive
    # ToDo: Complete the ArchiveFiles@2 task and publish step 
    - task: ArchiveFiles@2
      displayName: 'Archive PerformanceTestSuite'
      inputs:
        rootFolderOrFile: '$(projectRoot)/automatedtesting/jmeter/'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-perftests.zip'
    # JMeter Test Suite - Publish    
    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-perftests.zip
      displayName: 'Upload Package'
      artifact: drop-perftests

    # Selenium (UI) Test Suite - Archive the package  
    # "ArchiveFiles@2" picks up the web package and archives it.
    - task: ArchiveFiles@2
      displayName: 'Archive UI Tests'
      inputs:
        rootFolderOrFile: '$(projectRoot)/automatedtesting/selenium'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-uitests.zip'
    # Selenium Test Suite - Publish the package  
    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-uitests.zip   # Same as the archiveFile artifact above. 
      displayName: 'Upload Package'
      artifact: drop-uitests

    # FakeRestAPI - Archive
    # ToDo: Complete the ArchiveFiles@2 task and publish step 
    - task: ArchiveFiles@2
      displayName: 'Archive FakeRestAPI'
      inputs:
        rootFolderOrFile: '$(projectRoot)/automatedtesting/jmeter/fakerestapi'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-fakerestapi.zip'
    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-fakerestapi.zip
      displayName: 'Upload Package'
      artifact: drop-fakerestapi

#--------------------------------------------#  
# DEPLOYMENT STAGE
#--------------------------------------------#    
- stage: Deploy
  jobs:
  # --------------------------------------------#  
  # Deploy FakeRestAPI Web App
  - deployment: DeployAPI 
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureWebApp@1
            displayName: 'Deploy FakeRestAPI Web App as folder'
            inputs:
              azureSubscription: '$(azureServiceConnectionId)'
              appName: 'testApplication-AppService'
              resourceGroupName: 'devops-test-3'
              package: '$(System.DefaultWorkingDirectory)/automatedtesting/jmeter/fakerestapi'
              appType: 'webApp'
# # --------------------------------------------#  
# # TEST STAGE
# # --------------------------------------------#    
- stage: Test
  dependsOn: Deploy
  jobs:
  - job: TestAPI
    steps:
    # --------------------------------------------#    
    # Postman - Install Newman    
    - task: CmdLine@2
      displayName: Install Newman
      inputs:
        script: |
          sudo apt-get -y install npm
          sudo npm cache clean -f
          sudo npm install -g n
          sudo n stable
          sudo npm install -g newman
        workingDirectory: $(projectRoot)
    # Postman Data Validation Test Suite    
    - task: CmdLine@2
      displayName: Run Data Validation Tests
      continueOnError: true
      inputs:
        script: 'newman run TestSuite.Data-Validation.json -e Test.environment.json --reporters cli,junit --reporter-junit-export TEST-DataValidation.xml'
        workingDirectory: '$(projectRoot)/automatedtesting/postman'
    # Postman Regression Test Suite    
    - task: CmdLine@2
      displayName: Run Regression Tests
      continueOnError: true
      inputs:
        script: 'newman run TestSuite.Regression.json -e Test.environment.json --reporters cli,junit --reporter-junit-export TEST-Regression.xml'
        workingDirectory: '$(projectRoot)/automatedtesting/postman'
    # Postman - Publish Results 
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        searchFolder: 'automatedtesting/postman'
        mergeTestResults: true
        testRunTitle: 'Publish test results'
  
   # --------------------------------------------
   # Jmeter - Performance Test Suite     
  - job: TestJMeter
    displayName: Test JMeter
    steps:
    - bash: |
        echo "Waiting for API..."
        until curl -s https://testapplication-appservice.azurewebsites.net > /dev/null; do
          echo "Still waiting..."
          sleep 10
        done
      displayName: Wait for API startup
    - bash: |
        sudo apt-get install openjdk-11-jre-headless -y
        java -version
        wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.2.tgz -O jmeter.tgz
        tar xzvf jmeter.tgz
        mkdir -p log/jmeter
      displayName: Install JMeter
    - bash: |
        apache-jmeter-5.6.2/bin/jmeter -n -t automatedtesting/jmeter/stress-test.jmx \
                                    -l log/jmeter/stress-test-result.csv \
                                    -e -f -o log/jmeter/stress-test-html-report \
                                    -j log/jmeter/jmeter-stress-test.log
      displayName: JMeter Stress Test
    - bash: |
        apache-jmeter-5.6.2/bin/jmeter -n -t automatedtesting/jmeter/endurance-test.jmx \
                                    -l log/jmeter/endurance-test-result.csv \
                                    -e -f -o log/jmeter/endurance-test-html-report \
                                    -j log/jmeter/jmeter-endurance-test.log
      displayName: JMeter Endurance Test
    - task: ArchiveFiles@2
      displayName: Save JMeter Stress Test Report to Artifact
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/log/jmeter/stress-test-html-report'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(System.DefaultWorkingDirectory)/log/jmeter/stress-test-html-report-$(Build.BuildId).zip'
        verbose: true
    - task: ArchiveFiles@2
      displayName: Save JMeter Endurance Test Report to Artifact
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/log/jmeter/endurance-test-html-report'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(System.DefaultWorkingDirectory)/log/jmeter/endurance-test-html-report-$(Build.BuildId).zip'
        verbose: true
    - task: PublishPipelineArtifact@1
      displayName: Publish JMeter Logs
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/log/jmeter'
        artifactName: 'drop-jmeter-logs'

  - deployment: VMDeploy
    displayName: Selenium Tests
    environment:
      name: $(environmentName)         
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          # ---------------- Install Python + venv + Selenium ----------------
          - task: Bash@3
            displayName: Selenium installs
            inputs:
              targetType: 'inline'
              script: |
                #!/bin/bash
                
                # Update system
                sudo apt-get update -y
                sudo apt-get upgrade -y
                sudo apt-get install -y python3-venv unzip wget curl
  
                # Install Chrome stable
                wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
                sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
                sudo apt-get update -y
                sudo apt-get install -y google-chrome-stable
                
                # Create virtual environment for Selenium
                python3 -m venv ~/selenium-venv
                source ~/selenium-venv/bin/activate
  
                # Upgrade pip inside venv and install Selenium
                pip install --upgrade pip
                pip install selenium
  
          # ---------------- Run Selenium Tests ----------------
          - task: Bash@3
            displayName: Selenium Tests
            inputs:
              targetType: 'inline'
              script: |
                #!/bin/bash
                
                # Activate virtual environment
                source ~/selenium-venv/bin/activate

                sudo rm -f /usr/local/bin/chromedriver
  
                # Move to the dropped artifact and unzip
                cd $(Pipeline.Workspace)/drop-uitests
                unzip -o $(Build.BuildId)-uitests.zip -d uitests
                cd uitests
  
                # Let Selenium manage chromedriver automatically (no manual download)
                export PATH=$PATH:$PWD
  
                # Run your Selenium test
                python3 -u login.py 2>&1 | tee selenium-test.log
  
          # ---------------- Publish Logs ----------------
          - task: PublishPipelineArtifact@1
            displayName: Publish Selenium Logs
            inputs:
              targetPath: '$(Pipeline.Workspace)/drop-uitests/uitests/selenium-test.log'
              artifactName: 'drop-selenium-logs'




















































